services:
  api:
    build: .
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      STRING: mongodb://mongo:27017/betalife
      JWT_SECRET: local-compose-secret-change-me
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
